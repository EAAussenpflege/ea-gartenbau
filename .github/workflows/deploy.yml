# =========================================================
# Baut die Astro-Seite und lädt sie per FTP zu Hostinger hoch.
# Läuft bei jedem Push auf main – oder manuell über den
# Reiter "Actions" auf GitHub ("Run workflow").
#
# Vorher einmalig auf GitHub anlegen:
#   Settings → Secrets and variables → Actions → New repository secret
#     FTP_SERVER     FTP-Host oder IP-Adresse aus dem hPanel
#     FTP_USERNAME   FTP-Benutzername aus dem hPanel
#     FTP_PASSWORD   FTP-Passwort aus dem hPanel
#
# Dieselben Werte stehen lokal in der Datei .env.
# =========================================================

name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Verhindert, dass sich zwei Deployments gleichzeitig ins Gehege kommen.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      # Die GitHub-Runner haben kein IPv6-Netz. Löst der FTP-Host auf eine
      # IPv6-Adresse auf, bricht die Verbindung mit ENETUNREACH ab. Deshalb
      # wird die IPv4-Adresse vorab nachgeschlagen und fest in /etc/hosts
      # eingetragen – der Hostname bleibt dabei erhalten. Ist FTP_SERVER
      # bereits eine IP-Adresse, entfällt der Schritt.
      - name: FTP-Server auf IPv4 festlegen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if printf '%s' "$FTP_SERVER" | grep -qE '^[0-9]+(\.[0-9]+){3}$'; then
            echo "FTP_SERVER ist bereits eine IPv4-Adresse – nichts zu tun."
            exit 0
          fi

          IPV4=$(getent ahostsv4 "$FTP_SERVER" | awk '{ print $1; exit }')
          if [ -z "$IPV4" ]; then
            echo "Keine IPv4-Adresse fuer den FTP-Server gefunden."
            exit 1
          fi
          echo "IPv4-Adresse gefunden: $IPV4"
          echo "$IPV4 $FTP_SERVER" | sudo tee -a /etc/hosts > /dev/null

      - name: Per FTP zu Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Verschlüsselte Übertragung. Falls Hostinger das ablehnt,
          # hier auf "ftp" ändern.
          protocol: ftps

          # Was hochgeladen wird: der Inhalt von dist/ (Schrägstrich am Ende!)
          local-dir: ./dist/

          # Wohin: Nach dem Login landet man im Home-Verzeichnis. Der
          # Webordner der Domain liegt darunter – NICHT unter /public_html.
          server-dir: ./domains/ea-gartenbau-pflege.de/public_html/

          # Diese Dateien gehören nicht auf den Webserver.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
