# =========================================================
# Baut die Astro-Seite und lädt sie per FTP zu Hostinger hoch.
# Läuft bei jedem Push auf main – oder manuell über den
# Reiter "Actions" auf GitHub ("Run workflow").
#
# Vorher einmalig auf GitHub anlegen:
#   Settings → Secrets and variables → Actions → New repository secret
#     FTP_SERVER     FTP-Host aus dem hPanel
#     FTP_USERNAME   FTP-Benutzername aus dem hPanel
#     FTP_PASSWORD   FTP-Passwort aus dem hPanel
# =========================================================

name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Verhindert, dass sich zwei Deployments gleichzeitig ins Gehege kommen.
concurrency:
  group: deploy-strato
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      # Die GitHub-Runner haben kein IPv6-Netz. Löst der FTP-Host auf eine
      # IPv6-Adresse auf, bricht die Verbindung mit ENETUNREACH ab. Wir
      # schlagen die IPv4-Adresse nach und tragen sie fest in /etc/hosts ein –
      # so bleibt der Hostname erhalten (wichtig für das FTPS-Zertifikat).
      - name: FTP-Server auf IPv4 festlegen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          IPV4=$(getent ahostsv4 "$FTP_SERVER" | awk '{ print $1; exit }')
          if [ -z "$IPV4" ]; then
            echo "Keine IPv4-Adresse fuer den FTP-Server gefunden."
            exit 1
          fi
          echo "IPv4-Adresse gefunden: $IPV4"
          echo "$IPV4 $FTP_SERVER" | sudo tee -a /etc/hosts > /dev/null

      - name: Per FTP zu STRATO hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Verschlüsselte Übertragung. Falls STRATO das für dein Paket
          # nicht unterstützt, hier auf "ftp" ändern.
          protocol: ftps

          # Was hochgeladen wird: der Inhalt von dist/ (Schrägstrich am Ende!)
          local-dir: ./dist/

          # Wohin: Zielverzeichnis auf dem Webspace.
          # Bei Hostinger liegt die Website immer in public_html.
          server-dir: ./public_html/

          # Diese Dateien gehören nicht auf den Webserver.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
